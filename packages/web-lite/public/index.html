<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob: file:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; font-src 'self' data: file:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="description"
      content="EasyMarkdown Lite — a local, serverless Markdown editor powered by Keep mode."
    />
    <meta name="color-scheme" content="light dark" />
    <title>EasyMarkdown Lite</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c86b35'/%3E%3Cpath d='M8 9h5l3 5 3-5h5v14h-4v-8l-4 6-4-6v8H8z' fill='%23fff8ef'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./assets/app.css" />
    <script>
      try {
        document.documentElement.style.background =
          localStorage.getItem('easymarkdown.web-lite.theme') === 'dark' ? '#16130e' : '#ebe7e0'
      } catch (_) {}
    </script>
  </head>
  <body class="light">
    <div id="root">
      <div class="lite-boot" aria-label="EasyMarkdown Lite">
        <span></span>
        <strong>EasyMarkdown Lite</strong>
      </div>
    </div>
    <script src="./assets/app.js"></script>
  </body>
</html>
