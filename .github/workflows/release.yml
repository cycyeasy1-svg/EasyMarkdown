name: Release

# A tag can package and publish only after signing credentials, the shared fast
# gate, and the complete Electron E2E suite pass. Missing credentials fail
# closed: electron-builder must never silently publish an unsigned official tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-readiness:
    name: Signing and notarization readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Require release signing secrets
        shell: bash
        run: |
          missing=()
          for name in \
            WIN_CSC_LINK WIN_CSC_KEY_PASSWORD \
            MAC_CSC_LINK MAC_CSC_KEY_PASSWORD \
            APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Official release blocked. Missing signing/notarization secrets: ${missing[*]}"
            exit 1
          fi

  quality-fast:
    name: Fast quality gate
    needs: release-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/vscode-extension/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install VS Code extension dependencies
        run: npm ci --prefix packages/vscode-extension

      - name: Version, lint, unit tests, and all product builds
        run: npm run quality:fast

  dependency-scan:
    name: Dependency baseline scan
    needs: release-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Reject vulnerability regression
        run: npm run dependencies:check

  e2e-full:
    name: Electron full E2E
    needs: [quality-fast, dependency-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and run full E2E
        run: xvfb-run --auto-servernum npm run test:e2e

  release:
    name: Package and publish (${{ matrix.platform }})
    needs: e2e-full
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop bundles
        run: npm run build

      - name: Package, sign, and publish (Windows)
        if: matrix.platform == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish always --config.forceCodeSigning=true

      - name: Package, sign, notarize, and publish (macOS)
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish always --config.forceCodeSigning=true --config.mac.notarize=true
